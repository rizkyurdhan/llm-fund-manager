services:
  fund-manager:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./reports
        target: /app/reports
        bind:
          create_host_path: false
